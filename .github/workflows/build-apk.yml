name: Build and publish Kay's Suggestion Inspector APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Android sources
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Kays-Friend-Inspector-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK on GitHub Releases
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Kays-Friend-Inspector-v2-Install.apk
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 Kays-Friend-Inspector-v2-Install.apk --clobber
          else
            gh release create v0.2.0 Kays-Friend-Inspector-v2-Install.apk \
              --title "Kay's Friend Suggestion Inspector v0.2.0 (beta)" \
              --notes "Free Android APK built from this repository. This is a beta: scans visible friend suggestions in TikTok, Snapchat, and Facebook after explicit Accessibility permission. It cannot know the platforms' hidden recommendation reasons or determine historical physical proximity. Contact display-name and possible cross-platform matches are unverified hints. This release has a new Android application ID to prevent conflicts with previously installed copies. Not yet tested on a physical Android device."
          fi
